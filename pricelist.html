<style>
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    font-family:'Tajawal', sans-serif;
    background:var(--cream);
    color:var(--ink);          /* was #fff on cream - invisible */
    line-height:1.7;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  img{display:block; max-width:100%;}
  a{color:inherit;}
  button,input{font:inherit; color:inherit;}

  .page{max-width:520px; margin:0 auto; padding:var(--s-6) var(--s-4) var(--s-16);}
  /* no padding of its own: poster.js measures this element to size the
     poster, and padding here would make it overflow on small screens. */
  .poster-holder{width:100%;}

  .bar{
    display:flex; align-items:center; justify-content:space-between;
    gap:var(--s-4); margin-bottom:var(--s-5); flex-wrap:wrap;
  }
  .home-link{
    display:inline-flex; align-items:center; gap:var(--s-2);
    font-size:var(--t-base); font-weight:700; color:var(--ink);
    text-decoration:none;
  }
  .home-link:hover{color:var(--blue);}
  .home-link svg{width:16px; height:16px;}
  .poster-toolbar{margin:0;}

  .page-note{
    text-align:center; margin-top:var(--s-6);
    font-size:var(--t-sm); color:var(--ink-soft);
  }
  .page-note a{color:var(--blue); font-weight:700;}
</style>
</head>
<body>

<div class="page">

  <div class="bar">
    <a class="home-link" href="index.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true" focusable="false"><path d="M3 11.5 12 4l9 7.5M5 10v9a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-9"/></svg>
      الصفحة الرئيسية
    </a>
    <div class="poster-toolbar">
      <button class="dl-btn" id="downloadBtn" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true" focusable="false"><path d="M12 3v13m0 0-4-4m4 4 4-4M5 21h14"/></svg>
        تحميل الصورة
      </button>
    </div>
  </div>

  <!-- Same builder as index.html (assets/js/poster.js), so the two pages
       cannot drift apart again. -->
  <div class="poster-holder">
    <div class="poster-stage">
      <div class="poster" id="poster"></div>
    </div>
  </div>

  <p class="page-note">
    الأسعار محدّثة يومياً حسب سعر البورصة.
    <a href="https://wa.me/201027572394?text=%D8%B9%D8%A7%D9%8A%D8%B2%20%D8%A3%D8%B7%D9%84%D8%A8%20%D9%85%D9%86%20%D9%81%D8%B1%D9%8A%D8%B4%20%D8%B2%D9%88%D9%86" target="_blank" rel="noopener">اطلب على واتساب</a>
  </p>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="assets/js/config.js"></script>
<script src="assets/js/pricing.js"></script>
<script src="assets/js/poster.js"></script>
<script>
  FZ.initPoster({
    onWarn: function (text) { console.warn('Fresh Zone:', text); }
  });
</script>

</body>
</html>
